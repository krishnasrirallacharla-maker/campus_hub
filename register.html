<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account | CampusHub</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <!-- Minimal Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand-logo">
        <div class="logo-icon"><i class="fa-solid fa-graduation-cap"></i></div>
        <span>Campus<span>Hub</span></span>
      </a>
      <div>
        <a href="login.html" class="btn btn-secondary btn-sm">Already have an account? Log In</a>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card auth-card-lg">
      <div class="auth-header">
        <div class="auth-icon"><i class="fa-solid fa-user-plus"></i></div>
        <h1>Join CampusHub</h1>
        <p>Create your student or faculty account to register and manage events.</p>
      </div>

      <form id="register-form">
        <!-- Role Switcher -->
        <label class="form-label" style="margin-bottom: 0.5rem;">I am registering as:</label>
        <div class="role-selector-grid">
          <label class="role-radio-card">
            <input type="radio" name="role" value="student" checked />
            <div class="role-box">
              <i class="fa-solid fa-user-graduate"></i>
              <span>Student Attendee</span>
            </div>
          </label>

          <label class="role-radio-card">
            <input type="radio" name="role" value="admin" />
            <div class="role-box">
              <i class="fa-solid fa-user-tie"></i>
              <span>Event Organizer / Admin</span>
            </div>
          </label>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="reg-name">Full Name <span class="required">*</span></label>
            <div class="input-icon-wrapper">
              <i class="fa-regular fa-user"></i>
              <input type="text" id="reg-name" class="form-input" placeholder="e.g. Maya Chen" required />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-email">College Email <span class="required">*</span></label>
            <div class="input-icon-wrapper">
              <i class="fa-regular fa-envelope"></i>
              <input type="email" id="reg-email" class="form-input" placeholder="student@college.edu" required />
            </div>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="reg-dept">Academic Department</label>
            <select id="reg-dept" class="form-select">
              <option value="Computer Science & Engineering">Computer Science & Engineering</option>
              <option value="Information Technology">Information Technology</option>
              <option value="Electrical & Electronics">Electrical & Electronics</option>
              <option value="Mechanical Engineering">Mechanical Engineering</option>
              <option value="Business Administration & MBA">Business Administration & MBA</option>
              <option value="Arts & Humanities">Arts & Humanities</option>
              <option value="Physical Education & Sports">Physical Education & Sports</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-rollno">Roll No / Student ID</label>
            <input type="text" id="reg-rollno" class="form-input" placeholder="e.g. CS2026-104" />
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="reg-password">Password <span class="required">*</span></label>
            <div class="input-icon-wrapper">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="reg-password" class="form-input" placeholder="At least 6 characters" required minlength="6" />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-confirm-password">Confirm Password <span class="required">*</span></label>
            <div class="input-icon-wrapper">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="reg-confirm-password" class="form-input" placeholder="Repeat password" required minlength="6" />
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="reg-submit-btn" style="margin-top: 0.5rem;">
          Create Campus Account
        </button>
      </form>

      <div class="auth-footer">
        Already registered? <a href="login.html">Sign in here</a>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('register-form');
      const submitBtn = document.getElementById('reg-submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const name = document.getElementById('reg-name').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const department = document.getElementById('reg-dept').value;
        const rollNo = document.getElementById('reg-rollno').value.trim() || 'N/A';
        const password = document.getElementById('reg-password').value;
        const confirmPassword = document.getElementById('reg-confirm-password').value;
        const role = document.querySelector('input[name="role"]:checked').value;

        if (password !== confirmPassword) {
          showToast('Passwords do not match. Please verify.', 'danger');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating Account...';

        try {
          const registeredUser = await auth.register({
            name,
            email,
            password,
            department,
            rollNo,
            role,
            semester: '1st Semester'
          });

          showToast(`Account created! Welcome, ${registeredUser.name}`, 'success');

          setTimeout(() => {
            if (registeredUser.role === 'admin') {
              window.location.href = 'admin-dashboard.html';
            } else {
              window.location.href = 'student-dashboard.html';
            }
          }, 600);
        } catch (err) {
          showToast(err.message, 'danger');
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Create Campus Account';
        }
      });
    });
  </script>
</body>
</html>
